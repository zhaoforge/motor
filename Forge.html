<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forge</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, "Microsoft YaHei", sans-serif;
        margin: 0;
        background: #f5f7fa;
        color: #222;
    }

    .container {
        max-width: 520px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    /* 九宫格 */
    #lockPage {
        text-align: center;
    }

    .dots {
        height: 35px;
        font-size: 28px;
        letter-spacing: 10px;
        margin-bottom: 20px;
    }

    .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        max-width: 330px;
        margin: 0 auto;
    }

    .key {
        height: 78px;
        border: none;
        border-radius: 16px;
        background: white;
        font-size: 28px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        cursor: pointer;
    }

    .key:active {
        transform: scale(0.95);
        background: #e9edf3;
    }

    #message {
        height: 30px;
        margin-top: 20px;
        font-size: 16px;
    }

    /* 解锁后的目录 */
    #contentPage {
        display: none;
    }

    .link {
        display: block;
        padding: 18px;
        margin: 15px 0;
        background: white;
        border-radius: 14px;
        text-decoration: none;
        color: #222;
        font-size: 19px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .link:active {
        transform: scale(0.98);
    }
</style>
</head>

<body>

<div class="container">

    <!-- 九宫格密码页：不显示标题 -->
    <div id="lockPage">

        <div class="dots" id="dots"></div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>

            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>

            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('0')">0</button>
        </div>

        <div id="message"></div>

    </div>

    <!-- 解锁后的目录 -->
    <div id="contentPage">

        <h1>同步电机</h1>

        <a class="link" href="并网运行第二种工况.html">
            并网运行第二种工况
        </a>

        <a class="link" href="V 形曲线.html">
            V 形曲线
        </a>

       <a class="link" href="电分发电机组运行限额.html">
    电分发电机组运行限额
</a>
    </div>

</div>

<script>

const correctCode = "0626";

let inputCode = "";

function pressKey(number) {

    inputCode += number;

    document.getElementById("dots").textContent =
        "●".repeat(inputCode.length);

    if (inputCode.length === 4) {

        if (inputCode === correctCode) {

            document.getElementById("lockPage").style.display = "none";
            document.getElementById("contentPage").style.display = "block";

        } else {

            document.getElementById("message").textContent = "顺序错误";

            setTimeout(function () {
                inputCode = "";
                document.getElementById("dots").textContent = "";
                document.getElementById("message").textContent = "";
            }, 700);
        }
    }
}

</script>

</body>
</html>
