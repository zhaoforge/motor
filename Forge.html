<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>电气知识库</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, "Microsoft YaHei", sans-serif;
        margin: 0;
        background: #f5f7fa;
        color: #222;
    }

    .container {
        max-width: 520px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    /* 九宫格密码页 */
    #lockPage {
        text-align: center;
    }

    .dots {
        height: 35px;
        font-size: 28px;
        letter-spacing: 10px;
        margin-bottom: 20px;
    }

    .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        max-width: 330px;
        margin: 0 auto;
    }

    .key {
        height: 78px;
        border: none;
        border-radius: 16px;
        background: white;
        font-size: 28px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        cursor: pointer;
    }

    .key:active {
        transform: scale(0.95);
        background: #e9edf3;
    }

    #message {
        height: 30px;
        margin-top: 20px;
        font-size: 16px;
    }

    /* 分类页面 */
    #categoryPage {
        display: none;
    }

    .category-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .category {
        border: none;
        background: white;
        border-radius: 16px;
        padding: 30px 10px;
        font-size: 20px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        cursor: pointer;
    }

    .category:active {
        transform: scale(0.97);
        background: #e9edf3;
    }

    /* 各科目录 */
    #motorPage,
    #powerPage {
        display: none;
    }

    .link {
        display: block;
        padding: 18px;
        margin: 15px 0;
        background: white;
        border-radius: 14px;
        text-decoration: none;
        color: #222;
        font-size: 19px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    .link:active {
        transform: scale(0.98);
    }

    .back {
        width: 100%;
        padding: 14px;
        margin-top: 25px;
        border: none;
        border-radius: 12px;
        background: #e5e9ef;
        font-size: 17px;
        cursor: pointer;
    }

    .back:active {
        transform: scale(0.98);
    }
</style>
</head>

<body>

<div class="container">

    <!-- 密码页 -->
    <div id="lockPage">

        <div class="dots" id="dots"></div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>

            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>

            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('0')">0</button>
        </div>

        <div id="message"></div>

    </div>


    <!-- 一级分类 -->
    <div id="categoryPage">

        <h1>电气知识库</h1>

        <div class="category-grid">

            <button class="category" onclick="openMotor()">
                同步电机
            </button>

            <button class="category" onclick="openPower()">
                电力系统分析
            </button>

        </div>

    </div>


    <!-- 同步电机目录 -->
    <div id="motorPage">

        <h1>同步电机</h1>

        <a class="link" href="并网运行第二种工况.html">
            并网运行第二种工况
        </a>

        <a class="link" href="V 形曲线.html">
            V 形曲线
        </a>

        <a class="link" href="电分发电机组运行限额.html">
            电分发电机组运行限额
        </a>

        <button class="back" onclick="backToCategory()">
            ← 返回分类
        </button>

    </div>


    <!-- 电力系统分析目录 -->
    <div id="powerPage">

        <h1>电力系统分析</h1>

        <!-- 以后把新的 HTML 放这里 -->

        <!-- 示例：
        <a class="link" href="电力线路参数.html">
            电力线路参数
        </a>
        -->

        <button class="back" onclick="backToCategory()">
            ← 返回分类
        </button>

    </div>

</div>


<script>

const correctCode = "0626";

let inputCode = "";

function pressKey(number) {

    if (inputCode.length >= 4) return;

    inputCode += number;

    document.getElementById("dots").textContent =
        "●".repeat(inputCode.length);

    if (inputCode.length === 4) {

        if (inputCode === correctCode) {

            document.getElementById("lockPage").style.display = "none";
            document.getElementById("categoryPage").style.display = "block";

        } else {

            document.getElementById("message").textContent = "顺序错误";

            setTimeout(function () {

                inputCode = "";

                document.getElementById("dots").textContent = "";
                document.getElementById("message").textContent = "";

            }, 700);
        }
    }
}


function openMotor() {

    document.getElementById("categoryPage").style.display = "none";
    document.getElementById("motorPage").style.display = "block";

}


function openPower() {

    document.getElementById("categoryPage").style.display = "none";
    document.getElementById("powerPage").style.display = "block";

}


function backToCategory() {

    document.getElementById("motorPage").style.display = "none";
    document.getElementById("powerPage").style.display = "none";

    document.getElementById("categoryPage").style.display = "block";

}

</script>

</body>
</html>
